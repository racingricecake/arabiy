<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic by root</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F3;--ink:#12222E;--mute:#5B6B76;--root:#0B6E63;--line:#CBD6DA;--panel:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Hanken Grotesk",system-ui,sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.25rem max(1rem,env(safe-area-inset-right)) 4rem max(1rem,env(safe-area-inset-left))}
h1{font-size:1.5rem;margin:0 0 .25rem}
.sub{color:var(--mute);margin:0 0 1.25rem;max-width:36rem}
/* Arabic text: never use letter-spacing or bold on Arabic, both break letter joining */
.ar,.root,.qw,.ex-ar,.gar,nav button,.opts button{font-family:Amiri,"Noto Naskh Arabic","Geeza Pro","Droid Arabic Naskh","Traditional Arabic",serif;letter-spacing:0;font-weight:400}
nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
nav button{font-size:1.3rem;line-height:1;min-width:44px;min-height:44px;padding:.6rem 1rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:.5rem;cursor:pointer}
nav button[aria-selected=true]{background:var(--root);color:#fff;border-color:var(--root)}
nav button.q{font:600 1rem/1 "Hanken Grotesk",sans-serif}
button:focus-visible{outline:3px solid #E0A100;outline-offset:2px}
.root{font-size:clamp(3rem,13vw,5.5rem);line-height:1.3;color:var(--root)}
.rm{margin:0 0 1.25rem;color:var(--mute)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{padding:.9rem 0 .9rem .8rem;border-bottom:1px solid var(--line);border-left:4px solid var(--kc,transparent)}
.top{display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:center}
.ar{font-size:2.3rem;line-height:1.6;text-align:right}
.r{color:var(--kc,var(--root))}
.meta{display:flex;flex-direction:column;min-width:0}
.tr{font-style:italic}.en{font-weight:600}
.kind{align-self:flex-start;display:inline-block;padding:.05rem .6rem;border:1px solid var(--kc,var(--line));border-radius:999px;color:var(--kc,var(--mute));font-size:.8rem;font-weight:600;margin-top:.15rem}
.ex{margin-top:.5rem;padding:.6rem .8rem;background:var(--panel);border-radius:.5rem;border:1px solid var(--line)}
.ex-ar{font-size:1.5rem;line-height:1.8;text-align:right}
.ex-en{color:var(--mute);font-size:.95rem}
.qw{font-size:3.2rem;line-height:1.5;margin:.5rem 0}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;max-width:24rem}
.opts button{font-size:1.6rem;line-height:1;min-height:56px;padding:1rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:.5rem;cursor:pointer}
.opts button.ok{background:var(--root);color:#fff}.opts button.no{background:#B3261E;color:#fff}
.fb{min-height:3rem;margin:1rem 0}
.next{font:600 1rem "Hanken Grotesk",sans-serif;min-height:44px;padding:.6rem 1.2rem;border-radius:.5rem;border:0;background:var(--ink);color:#fff;cursor:pointer}
.msg{padding:1rem;border:1px solid var(--line);background:var(--panel);border-radius:.5rem}
@media (max-width:420px){body{font-size:16px}.ar{font-size:2.1rem}.qw{font-size:2.8rem}}
.gl{display:flex;flex-wrap:wrap;gap:.4rem 1rem;direction:rtl}
.gw{display:flex;flex-direction:column;align-items:center;text-align:center}
.gar{font-size:1.5rem;line-height:1.7}
.gen{font-size:.8rem;color:var(--mute);line-height:1.2;max-width:7rem}
.tog{display:flex;align-items:center;gap:.6rem;min-height:44px;margin-bottom:.5rem;color:var(--mute);cursor:pointer}
.tog[hidden]{display:none}
.tog input{width:1.3rem;height:1.3rem;accent-color:var(--root)}
.hide-gloss .gen{display:none}
.ex-en{margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--line)}
.k-verb{--kc:#C2410C}.k-noun{--kc:#1D4ED8}.k-doer{--kc:#7E22CE}
.k-place{--kc:#0B6E63}.k-tool{--kc:#BE185D}.k-result{--kc:#3F6212}
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.legend[hidden]{display:none}
.hide-gloss .gl{gap:.1rem .5rem}
.hide-gloss .gar{line-height:1.8}
</style></head><body><main>
<h1>Arabic by root</h1>
<p class="sub">Most Arabic words grow from a root of three letters. Learn the root and you can recognise a whole family of words. The root letters are coloured in every word, and the colour shows the word type.</p>
<nav id="nav"></nav>
<div class="legend" id="legend"></div>
<label class="tog" id="tog"><input type="checkbox" id="glossTog" checked> Show word-by-word translation</label>
<div id="sections"><p class="msg">Loading words…</p></div>
<section id="quiz" hidden>
  <p>Which root does this word come from?</p>
  <div class="qw" id="qw" lang="ar" dir="rtl"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <button class="next" id="next" hidden>Next word</button>
  <p id="score" class="rm"></p>
</section>
</main>
<script>
// ===== SETTINGS: paste your published Google Sheet CSV link between the quotes =====
const SHEET_CSV_URL = "";
// Leave it empty to see the built-in sample words.
// ===================================================================================

const SAMPLE_CSV = `root,root_meaning,word,transliteration,meaning,type,example_ar,example_en,example_words
ك-ت-ب,writing,كَتَبَ,kataba,he wrote,verb,كَتَبَ الطَّالِبُ الرِّسَالَةَ.,The student wrote the letter.,كَتَبَ=wrote | الطَّالِبُ=the student | الرِّسَالَةَ=the letter
ك-ت-ب,writing,كِتَاب,kitāb,book,noun,هَذَا كِتَابٌ جَمِيلٌ.,This is a beautiful book.,هَذَا=this is | كِتَابٌ=a book | جَمِيلٌ=beautiful
ك-ت-ب,writing,كَاتِب,kātib,writer,doer,أَبِي كَاتِبٌ مَشْهُورٌ.,My father is a famous writer.,أَبِي=my father | كَاتِبٌ=a writer | مَشْهُورٌ=famous
ك-ت-ب,writing,مَكْتَب,maktab,"office, desk",place,الْقَلَمُ عَلَى الْمَكْتَبِ.,The pen is on the desk.,الْقَلَمُ=the pen | عَلَى=on | الْمَكْتَبِ=the desk
ك-ت-ب,writing,مَكْتَبَة,maktaba,"library, bookshop",place,أَذْهَبُ إِلَى الْمَكْتَبَةِ كُلَّ يَوْمٍ.,I go to the library every day.,أَذْهَبُ=I go | إِلَى=to | الْمَكْتَبَةِ=the library | كُلَّ يَوْمٍ=every day
ك-ت-ب,writing,مَكْتُوب,maktūb,written; letter,result,الِاسْمُ مَكْتُوبٌ عَلَى الْوَرَقَةِ.,The name is written on the paper.,الِاسْمُ=the name | مَكْتُوبٌ=written | عَلَى=on | الْوَرَقَةِ=the paper
د-ر-س,studying,دَرَسَ,darasa,he studied,verb,دَرَسَ أَحْمَدُ لِلِامْتِحَانِ.,Ahmad studied for the exam.,دَرَسَ=studied | أَحْمَدُ=Ahmad | لِلِامْتِحَانِ=for the exam
د-ر-س,studying,دَرْس,dars,lesson,noun,الدَّرْسُ الْيَوْمَ سَهْلٌ.,Today's lesson is easy.,الدَّرْسُ=the lesson | الْيَوْمَ=today | سَهْلٌ=easy
د-ر-س,studying,دِرَاسَة,dirāsa,study,noun,دِرَاسَةُ اللُّغَةِ مُمْتِعَةٌ.,Studying language is enjoyable.,دِرَاسَةُ=studying | اللُّغَةِ=language | مُمْتِعَةٌ=enjoyable
د-ر-س,studying,مَدْرَسَة,madrasa,school,place,ذَهَبَ الْوَلَدُ إِلَى الْمَدْرَسَةِ.,The boy went to school.,ذَهَبَ=went | الْوَلَدُ=the boy | إِلَى=to | الْمَدْرَسَةِ=the school
د-ر-س,studying,مُدَرِّس,mudarris,teacher,doer,الْمُدَرِّسُ يَشْرَحُ الدَّرْسَ.,The teacher explains the lesson.,الْمُدَرِّسُ=the teacher | يَشْرَحُ=explains | الدَّرْسَ=the lesson
ع-ل-م,knowing,عَلِمَ,ʿalima,he knew,verb,عَلِمْتُ الْخَبَرَ أَمْسِ.,I learned the news yesterday.,عَلِمْتُ=I learned | الْخَبَرَ=the news | أَمْسِ=yesterday
ع-ل-م,knowing,عِلْم,ʿilm,"knowledge, science",noun,الْعِلْمُ نُورٌ.,Knowledge is light.,الْعِلْمُ=knowledge | نُورٌ=light
ع-ل-م,knowing,عَالِم,ʿālim,"scholar, scientist",doer,هُوَ عَالِمٌ كَبِيرٌ فِي الْفِيزِيَاءِ.,He is a great scientist in physics.,هُوَ=he is | عَالِمٌ=a scientist | كَبِيرٌ=great | فِي=in | الْفِيزِيَاءِ=physics
ع-ل-م,knowing,مُعَلِّم,muʿallim,teacher,doer,مُعَلِّمُنَا لَطِيفٌ.,Our teacher is kind.,مُعَلِّمُنَا=our teacher | لَطِيفٌ=kind
ع-ل-م,knowing,تَعْلِيم,taʿlīm,education,noun,التَّعْلِيمُ مُهِمٌّ لِكُلِّ طِفْلٍ.,Education is important for every child.,التَّعْلِيمُ=education | مُهِمٌّ=important | لِكُلِّ=for every | طِفْلٍ=child
ع-ل-م,knowing,مَعْلُومَات,maʿlūmāt,information,noun,أَبْحَثُ عَنْ مَعْلُومَاتٍ جَدِيدَةٍ.,I am looking for new information.,أَبْحَثُ=I search | عَنْ=for | مَعْلُومَاتٍ=information | جَدِيدَةٍ=new
ف-ت-ح,opening,فَتَحَ,fataḥa,he opened,verb,فَتَحَ الرَّجُلُ الْبَابَ.,The man opened the door.,فَتَحَ=opened | الرَّجُلُ=the man | الْبَابَ=the door
ف-ت-ح,opening,فَتْح,fatḥ,opening; conquest,noun,فَتْحُ الْمَتْجَرِ فِي الصَّبَاحِ.,The shop opens in the morning.,فَتْحُ=opening of | الْمَتْجَرِ=the shop | فِي=in | الصَّبَاحِ=the morning
ف-ت-ح,opening,فَاتِح,fātiḥ,opener; light (colour),doer,لَوْنُ الْقَمِيصِ فَاتِحٌ.,The shirt's colour is light.,لَوْنُ=colour of | الْقَمِيصِ=the shirt | فَاتِحٌ=light
ف-ت-ح,opening,مِفْتَاح,miftāḥ,key,tool,أَيْنَ مِفْتَاحُ السَّيَّارَةِ؟,Where is the car key?,أَيْنَ=where | مِفْتَاحُ=key of | السَّيَّارَةِ=the car
ف-ت-ح,opening,مَفْتُوح,maftūḥ,open,result,الْبَابُ مَفْتُوحٌ.,The door is open.,الْبَابُ=the door | مَفْتُوحٌ=open
خ-ر-ج,going out,خَرَجَ,kharaja,he went out,verb,خَرَجَ أَخِي مِنَ الْبَيْتِ.,My brother left the house.,خَرَجَ=left | أَخِي=my brother | مِنَ=from | الْبَيْتِ=the house
خ-ر-ج,going out,خُرُوج,khurūj,"exit, departure",noun,وَقْتُ الْخُرُوجِ الْآنَ.,It is time to leave now.,وَقْتُ=time of | الْخُرُوجِ=leaving | الْآنَ=now
خ-ر-ج,going out,خَارِج,khārij,outside,doer,هُمْ يَلْعَبُونَ خَارِجَ الْبَيْتِ.,They are playing outside the house.,هُمْ=they | يَلْعَبُونَ=are playing | خَارِجَ=outside | الْبَيْتِ=the house
خ-ر-ج,going out,مَخْرَج,makhraj,"exit, way out",place,أَيْنَ الْمَخْرَجُ؟,Where is the exit?,أَيْنَ=where | الْمَخْرَجُ=the exit
خ-ر-ج,going out,إِخْرَاج,ikhrāj,taking out; directing (film),noun,إِخْرَاجُ هَذَا الْفِيلْمِ مُمْتَازٌ.,The direction of this film is excellent.,إِخْرَاجُ=directing | هَذَا=this | الْفِيلْمِ=film | مُمْتَازٌ=excellent
`;
const DIAC = /[\u064B-\u0652]/;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}

function toRoots(rows){
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=n=>head.indexOf(n);
  const need=["root","word","meaning"];
  const missing=need.filter(n=>col(n)<0);
  if(missing.length) throw new Error("Missing column(s): "+missing.join(", ")+". Row 1 must be: root, root_meaning, word, transliteration, meaning, type, example_ar, example_en, example_words.");
  const map=new Map();
  rows.slice(1).forEach(r=>{
    const get=n=>col(n)<0?"":(r[col(n)]||"").trim();
    const letters=Array.from(get("root")).filter(c=>/[\u0621-\u064A]/.test(c));
    if(!letters.length||!get("word")) return;
    const key=letters.join("-");
    if(!map.has(key)) map.set(key,{letters,meaning:get("root_meaning"),words:[]});
    const root=map.get(key);
    if(!root.meaning) root.meaning=get("root_meaning");
    root.words.push({ar:get("word"),tr:get("transliteration"),en:get("meaning"),kind:get("type"),exAr:get("example_ar"),exEn:get("example_en"),exWords:get("example_words")});
  });
  return [...map.values()];
}

function glossHtml(w){
  const pairs=(w.exWords||"").split("|").map(p=>{const i=p.indexOf("=");return i<0?null:[p.slice(0,i).trim(),p.slice(i+1).trim()];}).filter(p=>p&&p[0]);
  if(!pairs.length) return `<div class="ex-ar" lang="ar" dir="rtl">${esc(w.exAr)}</div>`;
  return `<div class="gl" dir="rtl">`+pairs.map(p=>`<div class="gw"><span class="gar" lang="ar">${esc(p[0])}</span><span class="gen" dir="ltr">${esc(p[1])}</span></div>`).join("")+`</div>`;
}

function highlight(word,letters){
  const clusters=[];
  for(const ch of word){ if(DIAC.test(ch)&&clusters.length) clusters[clusters.length-1]+=ch; else clusters.push(ch); }
  let i=0;
  return clusters.map(c=>{
    if(i<letters.length&&c[0]===letters[i]){ i++; return `<span class="r">${esc(c)}</span>`; }
    return esc(c);
  }).join("");
}

let ROOTS=[];
const label=r=>r.letters.join("-");
const kc=t=>"k-"+(t||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");

function render(){
  const nav=document.getElementById("nav");
  nav.innerHTML=ROOTS.map((r,n)=>`<button data-tab="r${n}" lang="ar">${label(r)}</button>`).join("")+`<button class="q" data-tab="quiz">Quiz</button>`;
  const html=ROOTS.map((r,n)=>`<section id="r${n}" hidden><div class="root" lang="ar" dir="ltr">${label(r)}</div>`+
    (r.meaning?`<p class="rm">the idea of <em>${esc(r.meaning)}</em></p>`:"")+
    `<ul>`+r.words.map(w=>`<li class="${kc(w.kind)}"><div class="top"><div class="meta"><span class="en">${esc(w.en)}</span><span class="tr">${esc(w.tr)}</span><span class="kind">${esc(w.kind)}</span></div><span class="ar" lang="ar" dir="rtl">${highlight(w.ar,r.letters)}</span></div>${w.exAr?`<div class="ex">${glossHtml(w)}${w.exEn?`<div class="ex-en">${esc(w.exEn)}</div>`:""}</div>`:""}</li>`).join("")+`</ul></section>`).join("");
  document.getElementById("sections").innerHTML=html;
  const kinds=[...new Set(ROOTS.flatMap(r=>r.words.map(w=>w.kind)).filter(Boolean))];
  document.getElementById("legend").innerHTML=kinds.map(k=>`<span class="kind ${kc(k)}">${esc(k)}</span>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
  show("r0");
}
function show(id){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===id));
  document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!==id);
  document.getElementById("tog").hidden=id==="quiz";
  document.getElementById("legend").hidden=id==="quiz";
  if(id==="quiz"&&!document.getElementById("qw").textContent) ask();
}

let right=0,total=0,cur;
function ask(){
  if(ROOTS.length<4){ document.getElementById("qw").textContent=""; document.getElementById("fb").textContent="Add at least 4 roots to your sheet to use the quiz."; return; }
  const r=ROOTS[Math.floor(Math.random()*ROOTS.length)];
  const w=r.words[Math.floor(Math.random()*r.words.length)];
  const others=ROOTS.filter(x=>x!==r).sort(()=>Math.random()-.5).slice(0,3);
  const choices=[r,...others].sort(()=>Math.random()-.5);
  cur={r,w};
  document.getElementById("qw").textContent=w.ar;
  document.getElementById("fb").textContent="";
  document.getElementById("next").hidden=true;
  const box=document.getElementById("opts"); box.innerHTML="";
  choices.forEach(c=>{ const b=document.createElement("button"); b.textContent=label(c); b.lang="ar"; b.dir="ltr"; b.onclick=()=>answer(b,c,box); box.appendChild(b); });
}
function answer(btn,c,box){
  total++; const ok=c===cur.r; if(ok) right++;
  [...box.children].forEach(x=>{x.disabled=true; if(x.textContent===label(cur.r)) x.classList.add("ok");});
  if(!ok) btn.classList.add("no");
  document.getElementById("fb").textContent=(ok?"Correct. ":"Not quite. ")+cur.w.tr+" means \u201c"+cur.w.en+"\u201d and comes from "+label(cur.r)+(cur.r.meaning?" ("+cur.r.meaning+")":"")+".";
  document.getElementById("score").textContent="Score: "+right+" / "+total;
  document.getElementById("next").hidden=false;
}
document.getElementById("next").onclick=ask;

(function(){
  const cb=document.getElementById("glossTog"); let on=true;
  try{ on=localStorage.getItem("gloss")!=="off"; }catch(e){}
  cb.checked=on; document.body.classList.toggle("hide-gloss",!on);
  cb.onchange=()=>{
    document.body.classList.toggle("hide-gloss",!cb.checked);
    try{ localStorage.setItem("gloss",cb.checked?"on":"off"); }catch(e){}
  };
})();

(async function(){
  try{
    let text=SAMPLE_CSV;
    if(SHEET_CSV_URL.trim()){
      const res=await fetch(SHEET_CSV_URL.trim());
      if(!res.ok) throw new Error("Could not load the sheet (HTTP "+res.status+"). Check that it is published to the web as CSV.");
      text=await res.text();
    }
    ROOTS=toRoots(parseCSV(text));
    if(!ROOTS.length) throw new Error("The sheet has no usable rows.");
    render();
  }catch(e){
    document.getElementById("sections").innerHTML=`<p class="msg">${esc(e.message)}</p>`;
  }
})();
</script></body></html>
